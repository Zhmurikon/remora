server {
    listen 80;
    server_name _;
    client_max_body_size 110m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = /callback/tg_v1/ {
        client_max_body_size 256k;
        proxy_pass http://remora-dev-telegram-bot-1:8080;
        proxy_set_header Host $host;
    }
    location = /callback/vk_v1/ {
        client_max_body_size 256k;
        proxy_pass http://remora-dev-vk-bot-1:8080;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://remora-dev-api-1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Внутренний uvicorn доверяет только gateway; входной X-Forwarded-For не наследуем.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    # Сохраняем URI и Host: они участвуют в подписи S3.
    location ~ ^/remora-(media|audio)/ {
        proxy_pass http://remora-dev-minio-1:9000;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    location = /app {
        absolute_redirect off;
        return 302 /app/;
    }
    # Модули Pyodide загружаются через import(), поэтому браузер требует JavaScript MIME,
    # а стандартный mime.types в образе nginx ещё не знает расширение .mjs.
    location ~ ^/app/assets/pyodide/.*\.mjs$ {
        root /srv;
        default_type application/javascript;
        try_files $uri =404;
    }
    location /app/ {
        root /srv;
        try_files $uri $uri/ /app/index.html;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    }
    location = /rasshifrovka/api/jobs {
        client_max_body_size 20m;
        proxy_pass http://remora-dev-web-1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }
    location ^~ /rasshifrovka/api/jobs/ {
        client_max_body_size 20m;
        proxy_pass http://remora-dev-web-1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }
    location / {
        proxy_pass http://remora-dev-web-1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
