server {
    listen 80;
    server_name _;
    client_max_body_size 110m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
    location = /callback/tg_v1/ {
        client_max_body_size 256k;
        proxy_pass http://remora-dev-telegram-bot-1:8080;
        proxy_set_header Host $host;
    }
    location = /callback/vk_v1/ {
        client_max_body_size 256k;
        proxy_pass http://remora-dev-vk-bot-1:8080;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://remora-dev-api-1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    # Сохраняем URI и Host: они участвуют в подписи S3.
    location ~ ^/remora-(media|audio)/ {
        proxy_pass http://remora-dev-minio-1:9000;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    location = /app { return 302 /app/; }
    location /app/ {
        root /srv;
        try_files $uri $uri/ /app/index.html;
    }
    location = /rasshifrovka/api/transcribe {
        client_max_body_size 1g;
        proxy_pass http://remora-dev-web-1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3h;
        proxy_send_timeout 3h;
    }
    location / {
        proxy_pass http://remora-dev-web-1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
