name: zapominalnya-local

x-runtime: &runtime
  restart: unless-stopped
  networks: [private]

x-api: &api
  <<: *runtime
  image: remora-dev-api:local
  working_dir: /workspace/apps/api
  environment:
    SECRET_KEY: ${LOCAL_SECRET_KEY:?run init.sh}
    DATABASE_URL: postgresql+asyncpg://remora:${LOCAL_DB_PASSWORD:?required}@postgres/remora
    REDIS_URL: redis://redis:6379/0
    MEILI_URL: http://meilisearch:7700
    MEILI_MASTER_KEY: ${LOCAL_MEILI_KEY:?required}
    S3_ENDPOINT: http://s3.localhost:9100
    S3_ACCESS_KEY: remoralocal
    S3_SECRET_KEY: ${LOCAL_S3_PASSWORD:?required}
    SMTP_HOST: mailhog
    WEB_URL: http://localhost:3000
    APP_URL: http://localhost:3000/app
    CORS_ORIGINS: '["http://localhost:3000","http://localhost:5174"]'
    PYTHONDONTWRITEBYTECODE: '1'
  volumes:
    - ../../apps/api/app:/workspace/apps/api/app:ro
    - ../../apps/api/scripts:/workspace/apps/api/scripts:ro
    - ../../apps/api/migrations:/workspace/apps/api/migrations:ro
    - ../../apps/api/alembic.ini:/workspace/apps/api/alembic.ini:ro
    - ../../apps/api/pyproject.toml:/workspace/apps/api/pyproject.toml:ro
    - ../../apps/api/uv.lock:/workspace/apps/api/uv.lock:ro
    - python-deps:/opt/venv

x-ui: &ui
  <<: *runtime
  image: node:22.22.3-bookworm-slim
  user: "${LOCAL_UID:?required}:${LOCAL_GID:?required}"
  environment: &ui-env
    HOME: /tmp
    NEXT_TELEMETRY_DISABLED: '1'
  volumes:
    - ../../apps/web:/workspace/apps/web
    - ../../apps/app:/workspace/apps/app
    - ../../apps/admin:/workspace/apps/admin
    - ../../packages:/workspace/packages:ro
    - ../../assets:/workspace/assets:ro
    - ../../node_modules:/workspace/node_modules:ro
    - ../../package.json:/workspace/package.json:ro
    - ../../pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml:ro
    - ../../pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
    - ../../.private/local-next:/workspace/apps/web/.next

services:
  postgres:
    <<: *runtime
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: remora
      POSTGRES_DB: remora
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?required}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, remora]
      interval: 3s
      retries: 20
  redis:
    <<: *runtime
    image: redis:7-alpine
    volumes: [redis-data:/data]
  meilisearch:
    <<: *runtime
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${LOCAL_MEILI_KEY:?required}
      MEILI_NO_ANALYTICS: 'true'
    volumes: [meili-data:/meili_data]
  minio:
    <<: *runtime
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server --address :9100 /data
    environment:
      MINIO_ROOT_USER: remoralocal
      MINIO_ROOT_PASSWORD: ${LOCAL_S3_PASSWORD:?required}
    volumes: [objects:/data]
    networks:
      private:
        aliases: [s3.localhost]
  mailhog:
    <<: *runtime
    image: mailhog/mailhog:v1.0.1
  api:
    <<: *api
    command: uvicorn app.main:app --host 0.0.0.0 --reload --reload-dir app
    depends_on:
      postgres: { condition: service_healthy }
  worker:
    <<: *api
    command: [watchfiles, --target-type, command, --filter, python, "arq app.worker.WorkerSettings", app]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  web:
    <<: *ui
    working_dir: /workspace/apps/web
    command: node node_modules/next/dist/bin/next dev -H 0.0.0.0 -p 3000
    environment:
      <<: *ui-env
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000/app
      NEXT_PUBLIC_ANALYTICS_PREVIEW: '1'
      API_INTERNAL_URL: http://api:8000
  app:
    <<: *ui
    working_dir: /workspace/apps/app
    command: node node_modules/vite/bin/vite.js --host 0.0.0.0 --strictPort
    environment:
      <<: *ui-env
      VITE_BASE_PATH: /app/
      VITE_WEB_URL: http://localhost:3000
  admin:
    <<: *ui
    working_dir: /workspace/apps/admin
    command: node node_modules/vite/bin/vite.js --host 0.0.0.0 --strictPort
    environment:
      <<: *ui-env
      VITE_WEB_URL: http://localhost:3000
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    networks: [private, edge]
    ports:
      - 127.0.0.1:3000:3000
      - 127.0.0.1:5174:5174
      - 127.0.0.1:9100:9100
      - 127.0.0.1:8025:8025
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [web, app, admin, api, minio, mailhog]

networks:
  private: { internal: true }
  edge: {}
volumes:
  pg-data: {}
  redis-data: {}
  meili-data: {}
  objects: {}
  python-deps: {}
