map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
# Динамический DNS сохраняет связь после пересоздания отдельного сервиса.
resolver 127.0.0.11 valid=5s ipv6=off;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_buffering off;
proxy_read_timeout 1h;
client_max_body_size 110m;

server {
    listen 3000;
    location /api/ { set $target api:8000; proxy_pass http://$target; }
    location = /app { return 302 /app/; }
    location /app/ { set $target app:5173; proxy_pass http://$target; }
    location / { set $target web:3000; proxy_pass http://$target; }
}
server {
    listen 5174;
    location /api/ { set $target api:8000; proxy_pass http://$target; }
    location / { set $target admin:5174; proxy_pass http://$target; }
}
server {
    listen 9100;
    location / { set $target minio:9100; proxy_pass http://$target; }
}
server {
    listen 8025;
    location / { set $target mailhog:8025; proxy_pass http://$target; }
}
