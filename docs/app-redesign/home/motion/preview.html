<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #172229; background: #fff; font: 16px/1.45 Inter, "Segoe UI", Arial, sans-serif; }

  small { color: #56627a; font-size: 13px; }
  h2 { max-width: 68%; margin: 7px 0 22px; }
  button {
    display: inline-flex; align-items: center; gap: 14px; min-height: 44px; padding: 0 21px;
    border: 1px solid #284bb2; border-radius: 10px; background: #284bb2; color: white;

  .drawer { position: absolute; top: 50%; right: 3%; width: 25%; aspect-ratio: 380 / 288; transform: translateY(-50%); mix-blend-mode: multiply; pointer-events: none; }
  .drawer img, .drawer svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sheet { transform-box: fill-box; transform-origin: 50% 100%; transition: transform 180ms ease-in-out; }
  .ink { stroke: #344b83; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  @media (hover: hover) and (pointer: fine) {
    button:hover { background: #233d89; }
    button:hover ~ .drawer { --lift: translate(2px, -55px) rotate(2deg); }
  }
  button:focus-visible ~ .drawer, html[data-state="open"] .drawer { --lift: translate(2px, -55px) rotate(2deg); }
  @media (prefers-reduced-motion: no-preference) {
    .sheet { transform: var(--lift, none); }
    button:focus-visible ~ .drawer .sheet, html[data-state="open"] .sheet { transition: transform 250ms cubic-bezier(.22,.75,.22,1); }
    @media (hover: hover) and (pointer: fine) {
      button:hover ~ .drawer .sheet { transition: transform 250ms cubic-bezier(.22,.75,.22,1); }
    }
  }
  @media (max-width: 540px) {
    main { padding: 18px; }
    article { padding: 23px 18px; }
    h2 { max-width: 100%; font-size: 24px; margin-bottom: 28px; }

  }
