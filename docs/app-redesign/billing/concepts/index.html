<!doctype html>
<html lang="ru" data-theme="light">

26px;max-width:1500px;width:100%;margin:auto}header{border-bottom:1px solid rgb(var(--rm-lecture-line));padding-bottom:23px}.intro{margin-top:14px;max-width:760px;font-size:16px;color:rgb(var(--rm-lecture-muted));line-height:1.6}.status{margin-top:24px;padding:17px 22px;border:1px solid rgb(var(--rm-lecture-line));border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:28px;background:rgb(var(--rm-lecture-paper))}.status-title{font-size:18px;font-weight:500}.status-copy{font-size:14px;color:rgb(var(--rm-lecture-muted));margin-top:3px}.badge{padding:4px 10px;border-radius:7px;font-size:12px;font-weight:400;background:rgb(var(--rm-lecture-selected));color:rgb(var(--rm-lecture-blue));white-space:nowrap}.status-right{display:flex;align-items:center;gap:9px;white-space:nowrap;font-size:14px;color:rgb(var(--rm-lecture-blue))}.tools{display:flex;justify-content:space-between;align-items:center;gap:24px;margin:26px 0 18px}.period{display:flex;background:rgb(var(--rm-lecture-paper));padding:4px;border:1px solid rgb(var(--rm-lecture-line));border-radius:12px}.period button{min-height:36px;padding:0 19px;border-radius:8px;font-size:14px}.period .active{background:rgb(var(--rm-lecture-action));color:white}.tools-left{display:flex;align-items:center;gap:18px}.promo{display:flex;align-items:center;gap:12px}.promo label{font-size:14px}.promo input{width:180px;height:44px;border:1px solid rgb(var(--rm-lecture-line));border-radius:10px;padding:0 12px;color:inherit;background:rgb(var(--rm-lecture-surface));font-size:14px}.promo input::placeholder{color:rgb(var(--rm-lecture-muted))}.payment-note{color:rgb(var(--rm-lecture-muted));font-size:13px;margin:12px 0 0}.btn{min-height:44px;padding:0 19px;border-radius:10px;border:1px solid rgb(var(--rm-lecture-line));font-size:14px;font-weight:500;color:rgb(var(--rm-lecture-action));background:rgb(var(--rm-lecture-surface));white-space:nowrap}.btn.primary{background:rgb(var(--rm-lecture-action));color:white;border-color:transparent}.btn:disabled{cursor:default;color:rgb(var(--rm-lecture-muted));background:rgb(var(--rm-lecture-paper))}.plan-price{font:32px/1.2 Georgia,serif;white-space:nowrap;font-variant-numeric:tabular-nums}.plan-price small{font:14px Inter,'Segoe UI',Arial,sans-serif;color:rgb(var(--rm-lecture-muted));margin-left:5px}.row-plans{border-top:1px solid rgb(var(--rm-lecture-line))}.plan-row{display:grid;grid-template-columns:180px 1fr 160px;gap:24px;align-items:center;padding:23px 20px;border-bottom:1px solid rgb(var(--rm-lecture-line))}.plan-row.plus{background:rgb(var(--rm-lecture-paper))}.plan-row h3{font:26px Georgia,serif;display:flex;gap:10px;align-items:center;margin-bottom:7px}.plan-row ul{margin:0;padding-left:17px;display:grid;gap:3px;font-size:14px}.plan-row li::marker{color:rgb(var(--rm-lecture-blue))}.plan-row .plan-price{font-size:27px}.plan-row .free-price{font-size:22px}.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.72fr);gap:38px;margin-top:30px}.history h2,.referral h2{margin-bottom:14px}.history-head,.payment-row{display:grid;grid-template-columns:1.1fr 1fr 1fr 80px;gap:12px;align-items:center}.history-head{font-size:12px;color:rgb(var(--rm-lecture-muted));padding:0 0 9px}.payment-row{font-size:14px;min-height:51px;border-top:1px solid rgb(var(--rm-lecture-line))}.payment-row .amount{text-align:right;font-variant-numeric:tabular-nums}.payment-status{font-size:13px;color:rgb(var(--rm-lecture-muted));display:flex;align-items:center;gap:6px}.payment-status svg{width:15px;height:15px}.referral{border-left:1px solid rgb(var(--rm-lecture-line));padding-left:30px}.referral p{color:rgb(var(--rm-lecture-muted));font-size:14px;max-width:340px}.referral-code{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;border:1px solid rgb(var(--rm-lecture-line));border-radius:10px;padding:0 13px;min-height:46px;font-size:14px}.copy{display:flex;align-items:center;gap:7px;color:rgb(var(--rm-lecture-action));min-height:44px;font-size:13px}.copy svg{width:17px;height:17px}.concept-note{margin-top:26px;color:rgb(var(--rm-lecture-muted));font-size:12px;display:flex;justify-content:space-between;gap:20px}.table-wrap{border:1px solid rgb(var(--rm-lecture-line));border-radius:14px;overflow:hidden}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}th,td{text-align:left;border-bottom:1px solid rgb(var(--rm-lecture-line));padding:11px 20px;font-weight:400;vertical-align:middle}th:first-child{width:31%}th:not(:first-child),td:not(:first-child){width:23%;border-left:1px solid rgb(var(--rm-lecture-line))}thead th{padding-top:20px;padding-bottom:20px;vertical-align:top}thead h3{font:28px Georgia,serif;margin-bottom:12px}thead .plan-price{font-size:29px}th:nth-child(3),td:nth-child(3){background:rgb(var(--rm-lecture-paper))}tbody th{color:rgb(var(--rm-lecture-muted))}tbody th small{display:block;font-size:12px}tfoot td{border-bottom:0;padding:16px 20px}tfoot .btn{width:100%}.table .lower{margin-top:28px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid rgb(var(--rm-lecture-line));border-radius:16px;padding:23px;display:flex;flex-direction:column;min-height:420px;position:relative}.card.plus{background:rgb(var(--rm-lecture-paper));border-color:rgb(var(--rm-lecture-action))}.card-top{display:flex;align-items:center;justify-content:space-between;min-height:54px;margin-bottom:12px}.card-top h3{font:30px Georgia,serif}.card-top img{width:67px;height:54px;object-fit:contain}.card .plan-price{font-size:34px}.card .caption{font-size:13px;color:rgb(var(--rm-lecture-muted));margin-top:7px;min-height:22px}.card ul{margin:20px 0 24px;padding:0;list-style:none;display:grid;gap:11px;font-size:14px;line-height:1.45}.card li{display:flex;gap:8px}.card li svg{color:rgb(var(--rm-lecture-blue));width:16px;height:18px;margin-top:1px}.card .btn{width:100%;margin-top:auto}.card.free .plan-price{font-size:29px}.cards-mode .lower{margin-top:29px}.cards-mode .tools{margin-top:24px}.table .status{margin-top:22px}.table .tools{margin-top:24px}.table .concept-note{margin-top:20px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.rail{display:none}main{padding:24px}.status{align-items:start}.status-right{white-space:normal}.tools{flex-wrap:wrap}.plan-row{grid-template-columns:1fr;gap:15px}.cards{grid-template-columns:1fr}.lower{grid-template-columns:1fr}.referral{border:0;padding:0}.table-wrap{overflow:auto}table{min-width:750px}.concept-note{display:none}}
</style>
<body><div class="shell"><aside class="rail"><div class="brand"><img src="../../../../apps/web/public/lecture-demo/remora-icon.png" alt="">Запоминальня</div><nav class="nav" aria-label="Основная навигация"></nav><div class="rail-bottom"><div class="account"><span class="avatar">П</span><div>Пользователь<p class="small">Учебный аккаунт</p></div></div><p>Тема: светлая</p><p class="logout">Выйти</p></div></aside><main></main></div>
<script>
// Это изолированный макет: кнопки выбора тарифа не создают платежей.
const paths={home:'m4 10 8-6 8 6v10h-5v-6H9v6H4Z',book:'M5 4h13v16H7a2 2 0 0 1-2-2V4Zm0 13h13M9 8h5',note:'M6 3h8l4 4v14H6ZM14 3v5h4M9 12h6m-6 4h6',practice:'M3 5h18v14H3ZM7 10l2 2-2 2m5 0h5',classes:'M4 20V8h16v12M8 8V4h8v4M9 20v-7h6v7',star:'m12 3 2.8 5.7L21 9.6l-4.5 4.4 1 6.2-5.5-3-5.5 3 1-6.2L3 9.6l6.2-.9Z',billing:'M3 6h18v12H3ZM3 10h18m-14 4h3',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm-2-5h4l1 3 3-1 2 3-2 3 2 3-2 3-3-1-1 3h-4l-1-3-3 1-2-3 2-3-2-3 2-3 3 1Z',check:'m5 12 4 4L19 6',copy:'M9 8h11v13H9ZM5 16H3V3h11v2',cancel:'m7 7 10 10M17 7 7 17',refund:'M8 5 3 10l5 5M3 10h11a6 6 0 0 1 0 12',lock:'M6 10h12v10H6ZM8 10V7a4 4 0 0 1 8 0v3'};
const icon=(n)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]}"></path></svg>`;
const nav=[['home','Главная'],['book','Материалы'],['note','Ai Конспекты'],['practice','Практика'],['classes','Классы'],['star','Достижения'],['billing','Тариф'],['settings','Настройки']];
document.querySelector('.nav').innerHTML=nav.map(([i,t])=>`<div class="${i==='billing'?'selected':''}">${icon(i)}${t}</div>`).join('');
const variant=new URLSearchParams(location.search).get('v')||'a';
const planFeatures={free:['10 курсов и 20 наборов','500 записей через MCP в неделю','1 класс и базовые отчёты','Без ИИ-инструментов'],plus:['Курсы, наборы и MCP без лимита','Закрытые курсы, наборы и конспекты','300 минут расшифровки в неделю','500 тыс. токенов генерации в неделю','Полные отчёты и XLSX'],pro:['Всё из Plus','1 500 минут расшифровки в неделю','2,5 млн токенов генерации в неделю']};
const names={free:'Free',plus:'Plus',pro:'Pro'};
const price=(p)=>p==='free'?'Бесплатно':`<span data-price="${p}">${p==='plus'?'2 499':'9 999'}</span> ₽<small data-period>/ год</small>`;
const choose=(p)=>p==='free'?'<button class="btn" disabled>Ваш тариф</button>':`<button class="btn ${p==='plus'?'primary':''}" type="button" title="Статичный концепт: оплата не подключена">Выбрать ${names[p]}</button>`;
const status=`<section class="status"><div><p class="status-title">Сейчас у вас Free <span class="badge">Текущий тариф</span></p><p class="status-copy">10 курсов, 20 наборов и 500 записей через MCP в неделю.</p></div><p class="status-right">${icon('check')}Обучение без ограничений</p></section>`;
const tools=`<div class="tools"><div class="tools-left"><div class="period" aria-label="Период оплаты"><button data-term="month" aria-pressed="false">Месяц</button><button class="active" data-term="year" aria-pressed="true">Год</button></div><span class="muted small">Разовая оплата · без автосписаний</span></div><div class="promo"><label for="promo">Промокод</label><input id="promo" placeholder="Введите код" autocomplete="off"></div></div>`;
const lower=`<div class="lower"><section class="history"><h2>История платежей</h2><div class="history-head"><span>Тариф и период</span><span>Дата</span><span>Статус</span><span style="text-align:right">Сумма</span></div>${[['Pro','Отменён','9 999','cancel'],['Pro','Отменён','9 999','cancel'],['Plus','Возвращён','2 499','refund']].map(([p,s,a,i])=>`<div class="payment-row"><span>${p} · год</span><span class="muted">26.10.2026</span><span class="payment-status">${icon(i)}${s}</span><span class="amount">${a} ₽</span></div>`).join('')}</section><section class="referral"><h2>Пригласите друга</h2><p>После его первой оплаты вы оба получите 30 дней Plus.</p><div class="referral-code"><span>RMR-DEMO</span><button class="copy" type="button" title="Демонстрационный код">${icon('copy')}Скопировать ссылку</button></div></section></div>`;
let content='';
if(variant==='a')content=`<div class="row-plans">${Object.keys(names).map(p=>`<article class="plan-row ${p}"><div><h3>${names[p]}</h3><div class="plan-price ${p==='free'?'free-price':''}">${price(p)}</div></div><ul>${planFeatures[p].map(f=>`<li>${f}</li>`).join('')}</ul>${choose(p)}</article>`).join('')}</div>`;
if(variant==='b')content=`<div class="table-wrap"><table><thead><tr><th><h3>Возможности</h3><p class="muted small">Недельные квоты указаны<br>для расшифровки и генерации.</p></th>${Object.keys(names).map(p=>`<th><h3>${names[p]} ${p==='free'?'<span class="badge">Текущий</span>':''}</h3><div class="plan-price">${price(p)}</div></th>`).join('')}</tr></thead><tbody>${[
['Курсы и наборы','10 курсов · 20 наборов','Без лимита','Без лимита'],['Записи через MCP<small>в неделю</small>','500','Без лимита','Без лимита'],['Закрытые материалы','Нет','Да','Да'],['Расшифровка<small>минут в неделю</small>','Нет','300','1 500'],['Генерация<small>токенов в неделю</small>','Нет','500 тыс.','2,5 млн'],['Классы и отчёты','1 класс · базовые отчёты','Полные отчёты и XLSX','Всё из Plus']].map(row=>`<tr><th>${row[0]}</th>${row.slice(1).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody><tfoot><tr><td class="muted small">Все режимы обучения<br>доступны на любом тарифе.</td>${Object.keys(names).map(p=>`<td>${choose(p)}</td>`).join('')}</tr></tfoot></table></div>`;
if(variant==='c')content=`<div class="cards">${Object.keys(names).map((p,i)=>`<article class="card ${p}"><div class="card-top"><h3>${names[p]}</h3><img alt="" src="../../../../apps/web/public/lecture-demo/pricing-${['cards','notebook','books'][i]}.webp"></div><div class="plan-price">${price(p)}</div><p class="caption">${['Для своих учебных материалов','Больше материалов и ИИ-инструменты','Повышенные квоты ИИ'][i]}</p><ul>${planFeatures[p].map(f=>`<li>${icon('check')}<span>${f}</span></li>`).join('')}</ul>${choose(p)}</article>`).join('')}</div>`;
const labels={a:'А · Тарифы строками',b:'Б · Сравнение возможностей',c:'В · Три карточки'};
document.querySelector('main').className=variant==='b'?'table':variant==='c'?'cards-mode':'';
document.querySelector('main').innerHTML=`<header><h1>Тариф и подписка</h1><p class="intro">Обучение и доступ к созданным материалам остаются свободными на любом тарифе.<br>Оплата добавляет объём, ИИ-инструменты и преподавательскую аналитику.</p></header>${status}${tools}${content}<p class="payment-note">Промокод учитывается при переходе к оплате. Скидка или дополнительные дни — по условиям кода.</p>${lower}<footer class="concept-note"><span>${labels[variant]} · Статичный концепт, 1440 px</span><span>Состояние Free · профиль и пригласительный код обезличены</span></footer>`;
document.querySelectorAll('[data-term]').forEach(button=>button.addEventListener('click',()=>{const month=button.dataset.term==='month';document.querySelectorAll('[data-term]').forEach(b=>{b.classList.toggle('active',b===button);b.setAttribute('aria-pressed',String(b===button))});document.querySelectorAll('[data-price]').forEach(p=>p.textContent=p.dataset.price==='plus'?(month?'299':'2 499'):(month?'999':'9 999'));document.querySelectorAll('[data-period]').forEach(p=>p.textContent=month?'/ мес.':'/ год')}));
</script>
</body></html>
