<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>А — Компактное уведомление</title><link rel="stylesheet" href="../../../../packages/ui/src/styles/tokens.css"><link rel="stylesheet" href="concepts.css"></head><body class="a"><div class="controls"><span>А — Компактное уведомление</span><button data-count="1">Одна награда</button><button data-count="3">Три награды</button><button id="reopen">Показать снова</button></div><main class="scene"><aside class="popup" role="status" aria-live="polite" aria-label="Получено новое достижение"><button class="close" aria-label="Закрыть уведомление"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 6 12 12M18 6 6 18"/></svg></button><h2>Новое достижение!</h2><div class="body"><div class="art"><img src="../../../../apps/app/src/features/achievements/assets/achievement-placeholder.webp" width="512" height="512" alt=""></div><div><h3>Первая сотня</h3><p class="description">Ответьте на 100 карточек</p></div></div><p class="extra">И ещё 2 в вашей коллекции</p><a class="action" href="http://localhost:3000/app/achievements">Посмотреть коллекцию</a></aside><p class="closed-note">Уведомление закрыто.</p></main><script>const scene=document.querySelector('.scene');document.querySelector('.close').onclick=()=>scene.classList.add('is-closed');document.querySelector('#reopen').onclick=()=>scene.classList.remove('is-closed');document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{scene.classList.remove('is-closed');scene.classList.toggle('is-single',b.dataset.count==='1')});</script></body></html>
