name: remora

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remora}
      POSTGRES_DB: ${POSTGRES_DB:-remora}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-remora} -d ${POSTGRES_DB:-remora}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-remora-dev-master-key}
      MEILI_ENV: development
    ports:
      - '${MEILI_PORT:-7700}:7700'
    volumes:
      - meili-data:/meili_data

  # Локальная замена S3 (в проде — Selectel Object Storage)
  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-remora}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-remora-dev-secret}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Создаёт бакеты при первом запуске и завершается
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-remora} ${S3_SECRET_KEY:-remora-dev-secret};
      mc mb --ignore-existing local/remora-media;
      mc mb --ignore-existing local/remora-audio;
      mc anonymous set download local/remora-media;
      mc anonymous set download local/remora-audio;
      echo 'бакеты готовы';
      "

  # Перехватывает исходящую почту, веб-интерфейс на :8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILHOG_UI_PORT:-8025}:8025'

volumes:
  postgres-data:
  redis-data:
  meili-data:
  minio-data:
