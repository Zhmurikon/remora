[project]
name = "remora-api"
version = "0.0.0"
description = "Remora API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
    "sqlalchemy[asyncio]>=2.0.37",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.1",
    "structlog>=25.1.0",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.14.0",
    "aiosmtplib>=5.1.3",
    "email-validator>=2.3.0",
    "boto3>=1.35.0",
    "pillow>=11.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "httpx>=0.28.1",
    "ruff>=0.9.2",
    "mypy>=1.14.1",
    "boto3-stubs[s3]>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async antipatterns
    "BLE",      # слепые except
]
ignore = [
    "B008",     # Depends() в аргументах по умолчанию — идиома FastAPI
    "RUF001",   # «неоднозначные» символы: у нас комментарии и сообщения на русском
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Файлы миграций генерирует Alembic по шаблону: op и sa импортируются всегда,
# в пустой миграции они не используются. Править их руками после каждой генерации бессмысленно.
"migrations/versions/*" = ["F401", "I001", "W291", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
